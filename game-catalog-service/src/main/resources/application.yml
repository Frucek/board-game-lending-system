spring:
  application:
    name: game-catalog-service

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/game_catalog
    username: postgres
    password: postgres

  sql:
    init:
      mode: always
      content:
        schema-locations: classpath:schema.sql

server:
  port: 8081

logging:
  level:
    root: INFO
    com.boardgamelending: DEBUG
    io.r2dbc.postgresql: DEBUG
    org.springframework.r2dbc: DEBUG
    org.springframework.data.r2dbc: DEBUG