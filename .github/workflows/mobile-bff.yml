name: Mobile BFF Tests

on:
  push:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: mobile-bff
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: mobile-bff
        run: pytest