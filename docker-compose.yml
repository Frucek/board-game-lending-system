services:

  game-catalog-db:
    image: postgres:16
    container_name: game-catalog-db
    environment:
      POSTGRES_DB: game_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - game_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  game-catalog-service:
    build:
      context: ./game-catalog-service
    container_name: game-catalog-service
    depends_on:
      game-catalog-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://game-catalog-db:5432/game_catalog
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres

  borrowing-service:
    build:
      context: ./borrowing-service
    container_name: borrowing-service
    ports:
      - "50051:50051"

  activemq:
    build:
      context: ./activemq
    container_name: activemq

    ports:
      - "61613:61613"
      - "61616:61616"
      - "8161:8161"

    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "61613"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s


  user-management-service:
    build:
      context: ./user-management-service
    container_name: user-management-service

    depends_on:
      activemq:
        condition: service_healthy

    ports:
      - "3000:3000"

    environment:
      ACTIVEMQ_HOST: activemq
      ACTIVEMQ_PORT: 61613

  web-bff:
    build:
      context: ./web-bff

    container_name: web-bff

    depends_on:
      - game-catalog-service
      - borrowing-service
      - user-management-service

    ports:
      - "4000:4000"

    environment:
      PORT: 4000
      GAME_CATALOG_URL: http://game-catalog-service:8081
      USER_SERVICE_URL: http://user-management-service:3000
      BORROWING_URL: borrowing-service:50051


  mobile-bff:
    build:
      context: ./mobile-bff

    container_name: mobile-bff

    depends_on:
      - game-catalog-service
      - borrowing-service
      - user-management-service

    ports:
      - "4001:4001"

    environment:
      GAME_CATALOG_URL: http://game-catalog-service:8081
      USER_SERVICE_URL: http://user-management-service:3000
      BORROWING_URL: borrowing-service:50051

volumes:
  game_catalog_data: