spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/game_catalog
    username: postgres
    password: postgres

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
    level:
      io.r2dbc.postgresql: DEBUG
      org.springframework.r2dbc: DEBUG
      org.springframework.data.r2dbc: DEBUG