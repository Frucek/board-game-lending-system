name: Borrowing Service

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: borrowing-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: borrowing-service
        run: |
          python -m unittest discover -s tests -v
          
  docker:
      needs: test
      runs-on: ubuntu-latest

      if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      steps:
        - name: Checkout repository
          uses: actions/checkout@v5

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and push image
          uses: docker/build-push-action@v6
          with:
            context: ./borrowing-service
            push: true
            tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/board-game-borrowing-service:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/board-game-borrowing-service:${{ github.sha }}