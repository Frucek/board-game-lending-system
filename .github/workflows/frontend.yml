        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend/borrowing-mf
        run: npm ci

      - name: Build
        working-directory: frontend/borrowing-mf
        run: npm run build